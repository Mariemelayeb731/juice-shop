name: DAST - OWASP ZAP

on:
  workflow_run:
    workflows: ["Docker Build Scan Trivy"]
    types: [completed]

jobs:
  zap-scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Juice Shop
        run: |
          docker build -t juice-shop:latest .
          docker run -d -p 3000:3000 --name juice-shop juice-shop:latest
          sleep 30

      - name: Wait for app ready
        run: |
          for i in {1..10}; do
            curl -s http://localhost:3000 > /dev/null && echo "App ready!" && break
            echo "Waiting... $i"
            sleep 10
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
